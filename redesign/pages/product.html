<script>
/* Legacy address: product.html?sku=SKU. Product pages now live at /product/<sku-slug>/ (real HTML for
   every visible product). Send visitors there; the slug rules match lib/slug.mjs. */
(function(){var s=(new URLSearchParams(location.search).get("sku")||"").trim();if(!s)return;
var slug=s.toLowerCase().replace(/\+/g,"-plus-").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
location.replace("/product/"+slug+"/");})();
</script>
