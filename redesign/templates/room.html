<!doctype html>
<html lang="en">
<head>
<!--@include head-->
<!--@seo {{slug}}.html-->
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="collection" data-collection="{{slug}}" data-nav="{{nav}}">
<!--@include header-->

<main id="main" class="lx-coll">
  <!--@include subnav-->
  <div class="lx-coll-head">
    <h1>{{h1}}<span class="lx-vh">{{vh}}</span></h1>
    <p class="lx-coll-head__count" data-count aria-live="polite">&nbsp;</p>
  </div>

  <div class="lx-filterbar">
    <div class="lx-filterbar__inner">
      <div class="lx-chips" role="group" aria-label="Filter by type" data-chips></div>
      <div class="lx-sort">
        <label for="lx-sort">Sort</label>
        <select id="lx-sort" data-sort aria-label="Sort">
          <option value="featured">Featured</option>
          <option value="price-desc">Price: high to low</option>
          <option value="price-asc">Price: low to high</option>
        </select>
      </div>
    </div>
  </div>

  <div class="lx-grid" data-grid
       data-interlude-src="{{ilsrc}}"
       data-interlude-alt="{{ilalt}}"
       data-interlude-text="{{iltext}}"
       data-interlude-href="{{ilhref}}"
       data-interlude-cta="{{ilcta}}">
    <noscript><p class="lx-empty">Please enable JavaScript to browse this collection, or <a class="lx-textlink" href="catalog.html">view all stock furniture</a>.</p></noscript>
    <!-- fixed-size skeletons, replaced by the real tiles (identical dimensions: no layout shift) -->
    <span class="lx-tile" aria-hidden="true"><span class="lx-tile__media"></span><span class="lx-tile__meta"><span class="lx-tile__eyebrow">&nbsp;</span><span class="lx-tile__name">&nbsp;</span><span class="lx-tile__price">&nbsp;</span></span></span>
    <span class="lx-tile" aria-hidden="true"><span class="lx-tile__media"></span><span class="lx-tile__meta"><span class="lx-tile__eyebrow">&nbsp;</span><span class="lx-tile__name">&nbsp;</span><span class="lx-tile__price">&nbsp;</span></span></span>
    <span class="lx-tile" aria-hidden="true"><span class="lx-tile__media"></span><span class="lx-tile__meta"><span class="lx-tile__eyebrow">&nbsp;</span><span class="lx-tile__name">&nbsp;</span><span class="lx-tile__price">&nbsp;</span></span></span>
  </div>

  <div class="lx-more">
    <p class="lx-more__note" data-more-note aria-live="polite"></p>
    <button class="lx-btn" type="button" data-more hidden>View more</button>
  </div>
</main>

<!--@include footer-->
<script src="site.js" defer></script>
<script src="luxe/luxe.js" defer></script>
<script src="luxe/luxe-collection.js" defer></script>
</body>
</html>
