<!doctype html>
<html lang="en">
<head>
<!--@include head-->
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://snsfurniture.com/{{slug}}.html">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SNS Furniture">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://snsfurniture.com/{{slug}}.html">
<!--@ogimage {{ogalt}}-->
<!--@breadcrumbs Home|,Custom Furniture|custom-furniture.html,{{h1}}|{{slug}}.html-->
<!--@collectionpage {{h1}}|{{slug}}.html|{{description}}-->
</head>
<body class="{{bodyclass}}" data-page="custom" data-nav="custom">
<!--@include header-->

<main id="main">
  {{{hero}}}

  <section class="lx-statement" aria-label="Design approach">
    <p class="lx-reveal">{{statement}}</p>
  </section>

  <section class="lx-topics" aria-labelledby="topics-h">
    <p class="lx-eyebrow lx-reveal">In consultation</p>
    <h2 class="lx-vh" id="topics-h">What we discuss</h2>
    <div class="lx-topics__row">{{{topics}}}</div>
    <p class="lx-topics__note lx-reveal">Final specifications and pricing are confirmed during your consultation.</p>
  </section>

  {{{figures}}}

  <section class="lx-process" id="process" aria-labelledby="process-h">
    <p class="lx-eyebrow lx-reveal">How it works</p>
    <h2 class="lx-h2 lx-reveal" id="process-h">From conversation to confirmed design.</h2>
    {{{process}}}
  </section>

  <section class="lx-options" data-custom-options-section aria-labelledby="custom-options" hidden>
    <p class="lx-eyebrow lx-reveal">Your design</p>
    <h2 class="lx-vh" id="custom-options">Custom options</h2>
    <div class="lx-options__grid" data-custom-options></div>
  </section>

  <!--@consult {{form}}-->

  <nav class="lx-furthers" aria-label="Related pages">{{{related}}}</nav>
</main>

<!--@include footer-->
<script src="site.js" defer></script>
<script src="luxe/luxe.js" defer></script>
<script src="luxe/luxe-custom.js" defer></script>
</body>
</html>
